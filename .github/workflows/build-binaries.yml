name: Build binaries

# Builds the self-contained `aka` Single Executable Application for each supported
# OS/arch and uploads it as a workflow artifact. No publishing here — the release
# workflow (later PR) attaches these to a GitHub Release. SEA has no cross-compilation,
# so each target builds on its own runner.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cli/**'
      - 'web-ui/**'
      - 'packages/**'
      # The installer scripts are the last link of the binary channel's trust
      # chain, and the step below is the only place they meet a REAL archive.
      # Without this entry an installer-only PR built no binary and exercised no
      # installer behaviour on any runner.
      - 'tools/installer/**'
      - '.github/workflows/build-binaries.yml'

# Declared explicitly rather than inherited. Without a `permissions:` block a
# workflow takes the repository's DEFAULT token scope, which is a repository
# setting no reader of this file can see and which an admin can widen for every
# workflow at once. This job checks out a commit and uploads a workflow
# artifact; the artifact upload authenticates with the runtime's own token
# rather than this one, so read access to the tree is the whole requirement.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: darwin-arm64 }
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: windows-2022, target: win32-x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.1
      - uses: actions/setup-node@v6
        with:
          # The SEA embeds whichever Node packages it, so pin the shipped runtime to
          # the repo's Active LTS (matches .nvmrc) rather than Current — the artifact
          # must not depend on who built it.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build the ESM bundle, the standalone web-ui sidecar, then package + self-verify
      # the binary (package:sea runs the binary's `--version` and fails if it can't boot).
      - run: pnpm --filter @akasecurity/cli build:sea
      - run: pnpm --filter @akasecurity/cli bundle:web-ui
      - run: pnpm --filter @akasecurity/cli bundle:extension
      - run: pnpm --filter @akasecurity/cli package:sea
      # Exercise the packaged binary against a real SQLite store: `init` + `stats` prove
      # the store read/write path that `package:sea`'s `--version` self-check never touches.
      - run: pnpm --filter @akasecurity/cli smoke:sea
      # Boot the packaged binary's dashboard in-process and assert it serves HTTP 200 —
      # covers the Next standalone server.js import path that `--version` never exercises.
      - run: pnpm --filter @akasecurity/cli smoke:dashboard
      # Prove the archive layout on every target — this is the only place the Windows
      # Compress-Archive zip path is exercised before a real release depends on it.
      # archive:sea emits aka-<version>-<triple>.(tar.gz|zip); extract it and confirm it
      # roots at aka-<triple>/ with the binary inside. Nothing is published here.
      - run: pnpm --filter @akasecurity/cli archive:sea
      - name: Verify archive layout (unix)
        if: runner.os != 'Windows'
        working-directory: cli/sea-dist
        run: |
          mkdir -p _roundtrip
          tar -xzf aka-*-${{ matrix.target }}.tar.gz -C _roundtrip
          test -f "_roundtrip/aka-${{ matrix.target }}/aka" \
            || { echo "::error::archive did not root at aka-${{ matrix.target }}/aka"; exit 1; }
      - name: Verify archive layout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: cli/sea-dist
        run: |
          $zip = Get-ChildItem "aka-*-${{ matrix.target }}.zip" | Select-Object -First 1
          New-Item -ItemType Directory -Force _roundtrip | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath _roundtrip -Force
          if (-not (Test-Path "_roundtrip/aka-${{ matrix.target }}/aka.exe")) {
            Write-Error "archive did not root at aka-${{ matrix.target }}/aka.exe"
            exit 1
          }
      # The third link of the trust chain, against the artifact a user actually
      # downloads. `archive:sea` hashed it and release-binaries.yml aggregates
      # those hashes; until this step, nothing anywhere executed the half that
      # VERIFIES a download and refuses a bad one. The suite serves the archive
      # over loopback (no egress) and runs the shipped script unmodified — on
      # Windows that is install.ps1, everywhere else install.sh. Its tampered and
      # not-listed cases run here too, on their own stub fixture.
      #
      # `pnpm --filter`, NOT `turbo run test`, and that is load-bearing.
      # AKA_INSTALLER_REAL_DIST is what switches the suite off its stub fixture,
      # and turbo hashes only the env it is told about — so under turbo this task
      # would hash-match the run ci.yml already cached WITHOUT the variable, and
      # replay a green in which the real archive was never installed. Routing
      # around turbo is what keeps this step's result its own. required-checks
      # .test.js pins the spelling for that reason.
      #
      # AKA_INSTALLER_ALLOW_USER_PATH is the consent to let install.ps1 reach its
      # HKCU `Path` write. A throwaway runner is exactly where that is fine and a
      # contributor's workstation is exactly where it is not, so the mutating
      # cases skip unless it is set — see tools/installer/test/install-ps1.test.ts.
      # It is inert off Windows; the sh half writes no persistent state.
      - name: Verify the installer trust chain against the real archive
        env:
          AKA_INSTALLER_REAL_DIST: ${{ github.workspace }}/cli/sea-dist
          AKA_INSTALLER_ALLOW_USER_PATH: '1'
        run: pnpm --filter @akasecurity/installer test
      - uses: actions/upload-artifact@v4
        with:
          name: aka-${{ matrix.target }}
          path: cli/sea-dist/aka-${{ matrix.target }}/
          if-no-files-found: error
