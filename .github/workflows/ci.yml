name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` is on top of the three default types (opened, synchronize,
    # reopened) because retargeting a PR's BASE fires only `edited`. Without it
    # a stacked PR moved onto main after its parent merged never runs this
    # workflow at all: the branch filter above now matches, but no event does,
    # so the required checks stay absent and the merge is blocked forever with
    # nothing to re-run. The cost is a run on title/body edits too — GitHub
    # gives one `edited` type for all three — which the concurrency group below
    # bounds, since it cancels a superseded run per PR ref.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# Cancel superseded runs: a new push to the same branch/PR stops the in-flight
# run instead of letting both finish. Saves the most Actions minutes on PRs that
# are pushed to repeatedly while iterating. main keeps a stable group per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 for the Diff coverage step below. The default depth-1
      # checkout has no merge base to diff against, so the gate could only be
      # given the base TIP — a two-dot diff against which attributes every line
      # that landed on main since the branch started to this PR. That is wrong in
      # both directions: an unrelated merge can redden a clean PR, and enough
      # well-covered churn can dilute a genuinely untested change into a pass.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Persist Turbo's local task cache across runs. Without this the runner
      # starts empty every time, so lint/typecheck/test/build re-run from
      # scratch for every package even when a PR touches only one.
      #
      # Cache-correctness invariants (a stale hit here = a false-green CI):
      #   - Root inputs that live outside any package and would otherwise be
      #     invisible to Turbo are declared in turbo.json globalDependencies:
      #     tsconfig.base.json (extended by every package's tsconfig) and
      #     rules/** (the built-in rule packs that plugin-sdk and detections
      #     load and test directly). Editing either busts every package's hash.
      #   - Cross-package invalidation for `test` and `build` flows through
      #     `^typecheck` (every lib has a typecheck task whose hash includes
      #     its source); `^build` alone was insufficient because libs are
      #     consumed as raw source and have no build task. See the test/build
      #     dependsOn in turbo.json.
      #   - format:check (prettier) runs outside Turbo, so it is never cached
      #     and always runs fresh; the shared ESLint ruleset is graph-tracked
      #     via the ^lint edge to @akasecurity/eslint-config.
      #
      # Key is scoped by lockfile hash so a dependency bump starts a fresh
      # cache lineage instead of dragging the old tree forward forever; the
      # per-commit suffix keeps entries immutable. restore-keys warm-start
      # from the newest compatible prior cache. GitHub's 10 GB LRU + 7-day
      # eviction bounds total growth.
      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # `turbo run …` drives per-package scripts — and the repo root is not a
      # workspace package. So repo-root sources no package owns — the
      # runtime-guarantee pair (test/setup/no-network.ts, tools/ci/egress-probe.mjs),
      # the repo-root `*.config.*`, and the eslint-config enforcement suites (whose
      # package `lint` is a no-op) — were reachable by no ESLint pass and no tsc
      # invocation at all: esbuild strips their types without checking them, so a
      # type error there surfaced nowhere. These passes are their only coverage —
      # lint:root runs a network-only second pass over the suites — and they run
      # outside Turbo for the same reason format:check does.
      #
      # `pnpm lint` and `pnpm typecheck` above already chain these, so on a red
      # root file the step above fails first and this one never runs. They stay
      # named steps anyway: they are what covers the root if that chaining is
      # ever dropped, and they are the steps a reader looks for when asking what
      # covers the repo root. The chain is what carries the same coverage to the
      # pre-push hook and the two release workflows, which run only the
      # workspace-wide scripts and never these steps.
      - name: Lint (repo root)
        run: pnpm lint:root

      - name: Typecheck (repo root)
        run: pnpm typecheck:root

      # --concurrency bounds how many PACKAGE test tasks run at once. Two layers
      # of parallelism multiply here: turbo runs packages concurrently (default
      # 10) and each package's vitest spawns its own worker pool sized to the
      # machine, so an unbounded run puts tens of processes on a hosted runner
      # with 4 cores. They are not competing for CPU so much as for DISK: this
      # repo never mocks node:sqlite or the filesystem, so every store test does
      # real fsync-heavy I/O in a real temp dir. Under that contention a hook
      # timeout stops measuring the code and starts measuring queue depth, which
      # is what made the Windows and macOS legs fail on a rotating cast of
      # unrelated files.
      #
      # It is spelled on the turbo call rather than through `pnpm test`, and that
      # is load-bearing: `pnpm test -- --concurrency=2` forwards the flag to each
      # TASK's command (`vitest run --concurrency=2`), not to turbo — the same
      # trap the no-network job documents for `--force`.
      - name: Test
        run: pnpm turbo run test --concurrency=2

      # Coverage is written by the step above, not by this one: every package's
      # vitest config turns it on unconditionally (test/vitest/coverage.ts says
      # why), which is what finally makes turbo's long-declared
      # `outputs: ["coverage/**"]` describe something real. Re-running the suite
      # instrumented here would measure a second, differently-cached run.
      #
      # Per-package FLOORS are enforced in that step too — a package below its
      # floor fails its own `vitest run`. There is deliberately no aggregate
      # threshold anywhere: one would be satisfied by covering an icon sheet
      # while a mutating Server Action stayed at zero.
      #
      # This step answers the other question — is the code this PR ADDS tested?
      # It reads the reports already on disk and needs no network: the gate is a
      # workspace tool, not a third-party uploader, so no coverage data leaves
      # the runner.
      - name: Diff coverage
        if: github.event_name == 'pull_request'
        run: >
          node tools/coverage-gate/src/check-diff-coverage.ts
          --base ${{ github.event.pull_request.base.sha }}
          --summary "$GITHUB_STEP_SUMMARY"

      # `always()` so a package that fell BELOW its floor still uploads the
      # report explaining which lines it lost — the coverage block sets
      # `reportOnFailure`, so the report exists precisely when it is most wanted.
      # `if-no-files-found: ignore` keeps a genuinely earlier failure (a crashed
      # suite that wrote nothing) reporting as itself rather than as a missing
      # artifact.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            */coverage/
            */*/coverage/
            !**/node_modules/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        run: pnpm build

  # No-network leg: the product's headline claim is that nothing leaves the
  # machine. The lint ban (@akasecurity/eslint-config) stops a network primitive
  # being WRITTEN; test/setup/no-network.ts refuses one being CALLED from inside
  # a vitest worker. Neither can see a CHILD PROCESS — a shell-out to `npm view`
  # or `claude -p` has its own copy of node:net — and a subprocess is exactly the
  # path the guarantee is most likely to leak through. This job closes that: the
  # whole suite runs inside a network namespace with nothing but loopback, so
  # every process in the tree is covered, and the script verifies the block is
  # real before running anything (an unreachable network and a broken command
  # look identical from a green run).
  #
  # Deliberately NO Turbo cache restore. The cache key falls back through
  # restore-keys to a prior commit's entry, so a restored cache would let turbo
  # replay a green `test` task that never executed under the block — the job
  # would report success having proved nothing. `--force` says the same thing
  # twice, for a checkout that somehow arrives with a warm .turbo/cache. It goes
  # to `turbo` directly: `pnpm test -- --force` forwards the flag to each task's
  # own command (`vitest run --force`), which vitest rejects outright.
  no-network:
    name: No-network · Full suite, egress blocked
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # The one step that legitimately needs the registry. Everything after this
      # runs with no route off the host.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test with egress blocked
        # --concurrency: see the Test step in the lint job. Bounded here too,
        # because this leg runs the whole workspace inside the namespace and is
        # subject to the same contention; the flag goes to turbo directly for
        # the same reason --force does.
        run: tools/ci/no-network-test.sh pnpm exec turbo run test --force --concurrency=2

  # macOS leg: the primary platform for a Claude Code plugin's users, and until
  # this job existed the only tier-1 platform whose tests never ran. macOS did
  # appear in build-binaries.yml and release-binaries.yml, but those compile the
  # SEA binary and run no suite — a darwin build is not darwin coverage.
  #
  # Three shipped code paths are darwin-only, and they are the reason this is a
  # full run rather than a filtered one like the Windows leg:
  #   - cli/src/lib/open-url.ts — the `open` branch (win32 gets `cmd /c start`,
  #     everything else `xdg-open`).
  #   - plugins/claude-code/src/triage/judge.ts — the darwin-only throwaway
  #     CLAUDE_CONFIG_DIR, which is the transcript-suppression control keeping
  #     raw findings out of ~/.claude/projects. Its platform is injectable, so
  #     the BRANCH already ran on every runner; what only this leg adds is the
  #     mkdtemp/rm pair against a real case-insensitive APFS volume.
  #   - packages/persistence/src/vault/key-provider.ts — the keychain custody
  #     backend, which shells out to /usr/bin/security and exists nowhere else.
  #
  # Two suites stop lying here, which is the sharpest single gain. Both guard a
  # chflags-based fault injection with `if (process.platform !== 'darwin')
  # return;`, and an early return REPORTS AS A PASS — so on every runner that
  # has ever existed they were green without executing:
  #   - packages/persistence/test/paths.test.ts — isolates `flag: 'wx'` (O_EXCL)
  #     in writeOwnerOnlyFileSync by freezing the directory so the leading rmSync
  #     cannot clear a planted tmp symlink. Drop the `wx` and the write follows
  #     the symlink onto the victim; this is the only case that catches it.
  #   - cli/test/commands/init.test.ts — freezes the settings dir so init's
  #     chmod fails and the warning path is reached.
  # Keep that in mind before filtering this job down: a filter that excludes
  # `persistence` or `cli` puts both back to passing without running.
  #
  # It runs `test`, not lint/typecheck/build. Lint and typecheck read source and
  # answer identically on every OS, so the ubuntu leg covers them; `build` is not
  # skipped so much as already implied, since turbo's `test` task dependsOn
  # `build`/`^build`. build-binaries.yml packages and smokes a darwin SEA as
  # well, but do not lean on that here — its pull_request trigger is scoped to
  # cli/**, web-ui/** and packages/**, so a plugins-only PR gets no darwin build
  # from it at all. The dependsOn is what actually covers this leg.
  #
  # --continue for the same reason the Windows job takes it: on a new platform
  # leg the first red package must not hide the rest.
  #
  # ONE CACHE INVARIANT IS LOAD-BEARING HERE AND WAS NOT BEFORE. Turbo's task
  # hash covers file contents, dependencies and env — NOT the platform. So a
  # .turbo/cache restored from a Linux run would hash-match on macOS and let
  # turbo replay Linux's green `test` tasks, and this job would report success
  # having executed nothing. What prevents that is `runner.os` leading both the
  # key and every restore-key: with one platform in CI that segment was
  # bookkeeping, and with three it is the whole guarantee. Do not reorder it out
  # of the prefix, and do not add a restore-key that omits it.
  macos:
    name: macOS · Full suite
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same shape as the ubuntu leg's cache, and deliberately a separate lineage
      # — see the runner.os note above.
      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Test
        # --concurrency: see the Test step in the lint job. This leg runs all 20
        # packages on a hosted macOS runner and was one of the two that failed
        # on rotating unrelated files.
        run: pnpm turbo run test --continue --concurrency=2

  # Windows leg: the CLI and plugins advertise Windows support (install.ps1), so
  # the OS-sensitive core — SQLite store, ~/.aka file layout, file walks, child
  # processes — gets exercised on windows-latest.
  #
  # THE FOUR PUBLISHED ARTIFACTS ARE THE FIRST FOUR FILTERS, and that is the one
  # part of this list with a rule behind it rather than a judgement. `cli`,
  # `ai-tc-claude-code`, `ai-tc-codex` and `ai-tc-antigravity` are every package
  # in the workspace npm actually publishes — everything else here is
  # `private: true` and reaches a user only inlined into one of those four. They
  # are also the packages carrying the most platform-specific code (`open-url.ts`'s
  # `cmd /c start`, `prompter.ts`'s setRawMode, `dashboard.ts`'s spawn +
  # require.resolve, `external-dispatch.ts`'s POSIX-only guard, the plugins'
  # built-script child processes), and until they were added this job's name
  # claimed a shipped surface none of them was part of.
  # `packages/eslint-config/test/required-checks.test.js` derives that set from the
  # workspace and fails when a published package is missing from this list, so a
  # fifth artifact cannot ship untested here. Note turbo exits 1 on a `--filter`
  # matching no package, so a typo here fails the job rather than quietly
  # narrowing it.
  #
  # Whose `test` is deliberately NOT here: `dashboard-ui` and `ui-kit`
  # (presentational, no I/O — `ui-kit` has no `test` script at all),
  # `plugin-browser-extension` (private, and its Node half is a native-messaging
  # host whose Windows install path `cli`'s extension suite already covers), and
  # `audit-gate` (repo tooling, never shipped).
  #
  # Say `test` rather than "excluded", because `plugin-browser-extension` is not
  # absent from this leg: `cli` devDepends on it and the `test` task
  # `dependsOn: ["build", "^build", "^typecheck"]`, so `--filter=@akasecurity/cli`
  # drags its `build` and `typecheck` in. Turbo's `Packages in scope:` line does
  # not list it while the log carries both as executed task groups — which is
  # exactly how a reader concludes it never runs here.
  #
  # That distinction had a cost attached. `plugins/browser-extension/test/
  # global-setup.ts` was the one of four `global-setup.ts` files without
  # `shell: USE_SHELL`, which was safe only for as long as its `test` stayed off
  # this leg. It now carries the flag like its three siblings, so adding that
  # filter is a one-line change rather than a debugging session — the shim would
  # otherwise fail before a single test ran.
  #
  # setup-wizard is included for
  # its plan-file handling (tmpdir/mkdtemp + path joins), which ships inside
  # the plugin bundle. web-ui is included because it
  # is bundled into the CLI (shipped surface), and turbo runs its whole `test`
  # script — EVERY suite, not just the middleware gate:
  #   - test/middleware.test.ts — the sole DNS-rebinding gate; pure string work
  #     (68 tests in ~40ms here).
  #   - test/actions/exceptions.test.ts — the three exception-granting Server
  #     Actions (addException's raw-secret handling, approveBlocked's ledger and
  #     key-version gates, rotateKey's confirmation gate), each driving a REAL
  #     node:sqlite store and a REAL key file per test. This is the OS-sensitive
  #     half and the reason it belongs on Windows.
  #   - test/helpers/store-bytes.test.ts — the at-rest leak reader that suite
  #     asserts through (6 tests in ~0.3s here). Opens no store, which is why it
  #     is cheap; one case needs POSIX modes and skips on Windows, so the same
  #     property is also pinned through an injected reader that runs everywhere.
  #   - test/pages/settings-page-head.test.ts — copy guard; pure (8 tests).
  # The exceptions suite is the slow one: ~2min wall for 74 tests — the other
  # three together are under a second — against the 20s per-test timeout in
  # web-ui/vitest.config.ts. A couple of cases assert POSIX mode bits and skip
  # here rather than pass with no assertions. Keep an eye on that margin: the
  # persistence suite needed batching twice to stay under it, and every test
  # added there pays a full store-seeding hook (~2s), which is why a test that
  # needs no store belongs beside the reader instead.
  # web-ui's `test` also drops the `build`/`^build` edges
  # (web-ui/turbo.json), so no `next build` runs here. Scoped to the
  # shipped-surface packages to keep the job fast; the full suite runs on the
  # Linux job above.
  #
  # @akasecurity/eslint-config is the one entry that ships nothing — it is
  # `private: true` and no artifact bundles it. It runs here as the ENFORCEMENT
  # HALF of the no-network guarantee (CLAUDE.md §4): its suites are what fail the
  # workspace when a package drops its config, its `lint` script stops covering a
  # directory, or a vitest config drops the runtime guard. The shipped surface is
  # only guarded on Windows if the thing that does the guarding runs there too.
  # What it specifically pins here is path handling that has no Linux or macOS
  # equivalent, so nothing else in CI can exercise it: globSync yields native
  # separators while `git ls-files` yields posix, and the two are compared
  # against each other throughout (effective-config.test.js normalizes with
  # `dir.split(sep).join('/')`, and matches globs through `path.posix.matchesGlob`
  # rather than a literal-prefix reduction, so a backslash checkout answers
  # identically). Those are the code paths that were unexercised until this
  # filter existed — and the first Windows run of the package caught a real one:
  # two cases declared with `it.each` (which passes no TestContext) threw instead
  # of skipping, on the only platform that reaches the skip.
  #
  # It runs its whole `test` script — every suite in the package — and depends on
  # no workspace package, so turbo schedules nothing upstream of it.
  #
  # Cost, over three Windows runs: the package's task 33s / 54s / 57s,
  # effective-config.test.js 32s / 53s / 55s of that, against ~4.7s on a
  # developer machine. Size a new case against the slower end — roughly a 10x
  # factor, not the 3-5x the store suites see. Treat those figures as a FLOOR
  # rather than the workload today: they were taken over an identical 604-test
  # run, and the package has grown well past that since (measure the current
  # figure with `pnpm --filter @akasecurity/eslint-config exec vitest run
  # --reporter=json` and read `numTotalTests` — do not trust a count written
  # here, which is what went stale last time).
  #
  # It is NOT on the critical path, and that is the number to reason about
  # rather than the job's wall clock. `@akasecurity/persistence` is the tail in
  # every run observed, and the test step tracks it plus ~20s of scheduling:
  #
  #   run       eslint-config   persistence   test step
  #   A                 54s          248s         274s
  #   B                 33s          433s         451s
  #   C                 57s          236s         262s
  #
  # Read B against C: this package's FASTEST run produced the SLOWEST step, and
  # its slowest produced the fastest. It cannot be what moves the step — a
  # 33-57s task runs inside persistence's shadow. What moves is runner
  # throughput: between B and the others every I/O-bound suite shifted 1.7-2x
  # (persistence 236-248s to 433s, web-ui 171-177s to 345s) while every
  # CPU-bound one got FASTER, this package included. So do not read this
  # package's cost off a before/after of the job; single-sample job timings on
  # this runner attribute nothing.
  #
  # The slow work sits in `beforeAll` hooks and three fault-injection cases that
  # all carry an explicit 120s budget; nothing else here runs long enough to
  # approach vitest's 5s default. The bash-driven cases in
  # no-network-runtime.test.js skip themselves on win32 (the CI script is the
  # Linux job's mechanism) rather than passing vacuously — 9 skipped, 45 run.
  #
  # WHAT THE FOUR PUBLISHED PACKAGES SKIP HERE, and why each skip is a skip
  # rather than a silent pass. Every one is `ctx.skip()` or `it.skipIf`, so it
  # is reported; an early `return` would read as a green assertion instead.
  #   - Unprivileged symlink creation (cli's init suite, the plugins' redact and
  #     tail-scrub suites). Windows gates it behind a privilege the runner does
  #     not grant, so the containment property those cases pin is asserted where
  #     it can be, not faked here.
  #   - POSIX mode-bit fault injection: a chmod is a no-op on Windows, so the
  #     read-only-store and unwritable-home rows would pass having injected
  #     nothing. Same rule the persistence suite already follows.
  # Everything else in the four runs, including the plugins' fail-open e2e
  # matrix and the bundled scan-worker resolution — which had never executed on
  # Windows and is exactly the resolve-a-sibling-by-path code most likely to
  # differ there.
  #
  # THE WIZARD JOURNEY SUITES WERE THIS LEG'S FIRST FAILURE, exactly as predicted
  # when the four packages were added, and they are SKIPPED here rather than
  # merely expected to fail. What runs them is `assertShimResolves`, and the
  # refusal is correct: a `.cmd` launcher cannot be reached by a shell-free
  # `execFileSync` at all, because Node's CVE-2024-27980 fix refuses to spawn a
  # `.cmd`/`.bat` without one. `writeCommandShim` writing the launcher is
  # necessary and not sufficient — the SPAWN has to opt in too.
  #
  # So the split is shell-vs-no-shell, not plugin-vs-plugin, and it is worth
  # reading that way before adding a skip anywhere else here:
  #   - `provenance.test.ts` passes `{ shell: USE_SHELL }` and RUNS on Windows,
  #     because it mirrors `runNpmAudit`, which does the same.
  #   - the three journey harnesses pass no shell, because they mirror
  #     `spawnClaude`/`spawnCodex`/`spawnAgy`, which pass none either.
  # A probe that disagreed with its subject would prove nothing, so the harnesses
  # are RIGHT to refuse; what they are refusing is a real limitation of the code
  # they model. That limitation is tracked separately — and until it moves, a
  # skip here is honest and a green run would not be.
  #
  # The refusal itself is load-bearing and must not be softened into a warning:
  # the stub fails OPEN, so a shim that does not land is not an ENOENT.
  # Resolution keeps walking PATH and finds the developer's real installed CLI,
  # and the chain would reach a live model with its seeded hits on stdin.
  #
  # It runs `test` only, and the job's name says so. Lint and typecheck read
  # source and answer identically on every OS, so the ubuntu leg covers them —
  # the same reasoning the macOS leg above records. The one genuinely
  # platform-sensitive part of the lint surface is `@akasecurity/eslint-config`'s
  # own path handling, and that is a `test` task, already in this filter.
  # The budget moved 25 -> 35 with the four packages, and that number is a
  # HEADROOM JUDGEMENT that a first measurement now supports. What it was sized
  # against: turbo's `test` dependsOn `build`/`^build`/`^typecheck`, so each new
  # package brings a tsup build with it on the first (cold-cache) run; the
  # plugin suites are the heaviest thing added and spend most of their time
  # spawning real child processes, which is the single slowest operation on this
  # runner; and the macOS leg runs every package inside 25. Windows is the
  # slowest of the three, so it gets more than macOS, not less.
  #
  # The one run that has completed with all four packages in it, cold:
  #
  #   Tasks:    35 successful, 35 total
  #   Cached:    0 cached, 35 total
  #     Time:    10m28.395s
  #
  # Nothing replayed, so that is the honest cost of a run that finishes — 3.3x
  # inside the ceiling, and the Turbo cache restored above only widens it.
  #
  # Read it as ONE sample, not as a settled figure, and keep 35: a contended
  # runner takes longer than this one did, and the headroom is what absorbs that
  # along with the first cold run after a lockfile bump. Tightening toward the
  # measured number would trade a real margin for a cosmetic one.
  #
  # What this budget does NOT address, and should not be reached for: this leg
  # also fails intermittently with per-test `Test`/`Hook timed out in 20000ms`,
  # a different test file each run, which is a starved runner rather than a
  # broken test. Those failures land well inside the job budget — the failing
  # run measured here took 12m07s of its 35 — so moving this number in either
  # direction does nothing about them. The per-test timeout is the knob that
  # governs those, not this one.
  windows:
    name: Windows · Unit tests (shipped surface)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same shape and the same separate-lineage rule as the other two cached
      # legs — see the runner.os note above the macOS job. This leg re-ran every
      # package from scratch on every push until it had one, which is also what
      # paid for the four packages added below.
      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Test the shipped surface and its enforcement
        # --continue: report every package's failures in one run instead of
        # hiding later packages behind the first red one.
        #
        # --concurrency: see the Test step in the lint job. This is the leg that
        # needed it most — Windows has the most expensive fsync of the three, so
        # it is where disk contention turned into timeouts first and worst.
        run: >
          pnpm turbo run test
          --continue
          --concurrency=2
          --filter=@akasecurity/cli
          --filter=@akasecurity/ai-tc-claude-code
          --filter=@akasecurity/ai-tc-codex
          --filter=@akasecurity/ai-tc-antigravity
          --filter=@akasecurity/schema
          --filter=@akasecurity/extract
          --filter=@akasecurity/detections
          --filter=@akasecurity/persistence
          --filter=@akasecurity/plugin-sdk
          --filter=@akasecurity/plugin-runtime
          --filter=@akasecurity/setup-wizard
          --filter=@akasecurity/scanner
          --filter=@akasecurity/local-ops
          --filter=@akasecurity/web-ui
          --filter=@akasecurity/eslint-config

  # Windows lint leg: every `lint` script in this workspace carries a GLOB — all
  # twenty packages target `*.config.*`, and so does the repo-root `lint:root`,
  # which is the twenty-first invocation rather than a twenty-first package —
  # and WHO EXPANDS IT is decided by the platform, not by the script. On POSIX
  # the shell expands the pattern and hands eslint concrete filenames; `cmd.exe`
  # does not glob at all, so eslint receives the literal pattern and runs its
  # own expansion. Both should work. Until this job existed neither was
  # observed on Windows, because `pnpm lint` ran on ubuntu-latest alone.
  #
  # It is load-bearing because `*.config.*` is the ONLY target that reaches each
  # package's root config files (CLAUDE.md, "Adding a new workspace package",
  # step 5). A pattern resolving to nothing there would take every ban off those
  # files on this platform, while the guard that audits coverage went on
  # reporting them covered — effective-config.test.js MODELS the expansion with
  # `path.posix.matchesGlob` rather than running it, so it answers from the
  # model on every platform and cannot see a real one that came back empty.
  #
  # A green run here is a real observation rather than a vacuous one, and that
  # rests on a measured detail: eslint fails an unmatched pattern PER PATTERN,
  # not only when every pattern is empty. Measured on eslint 9.39.4 —
  # `eslint src 'zzz*.config.*'` exits 2 with `No files matching the pattern
  # "zzz*.config.*" were found` even though `src` matches; the same command with
  # the real pattern exits 0. So an expansion that silently came back empty
  # reddens this job. It cannot pass quietly.
  #
  # Unfiltered, deliberately. Every lint script in the workspace carries the
  # glob, and `pnpm lint` chains `lint:root`, whose own `*.config.*` is the only
  # pass covering repo-root files that belong to no package.
  #
  # What this leg CANNOT exercise, so that nobody adds a case expecting it to:
  # the CRLF normalization in parseWorkspaceGlobs. `.gitattributes` sets
  # `* text=auto eol=lf`, so a Windows checkout gets LF like every other, and no
  # `\r` ever reaches that parser here. It is covered instead by a synthetic
  # case in effective-config.test.js that runs on every platform, which is the
  # only place it can be covered. What this leg DOES uniquely exercise is the
  # separator half: `globSync` yields native paths while `git ls-files` yields
  # posix, and on Windows alone those two disagree.
  #
  # DELIBERATELY NO TURBO CACHE, for the same reason the no-network job has
  # none. Turbo's hash covers file contents, dependencies and env — not the
  # runner image, the shell, or the Node build, which are exactly the inputs
  # this leg exists to exercise. A restored cache would let turbo replay a green
  # `lint` task that expanded no glob on this runner at all, and the job would
  # report success having observed nothing.
  #
  # Lint is the cheapest of the four task types, which is what makes a cold run
  # affordable where a cold `test` would not be. Measured on THIS runner rather
  # than extrapolated (`gh run view 31536100993 --repo akasecurity/ai-tc`): the
  # Lint step 1m49s, the whole job 2m41s. The same `pnpm lint` at `Cached: 0` on
  # an M-series Mac is 72s for all twenty packages plus 6.5s for lint:root and
  # 0.6s for check:portability.
  #
  # So the ~10x factor the test leg above documents does NOT transfer to lint —
  # here it is about 1.5x. Size a lint budget off a lint measurement; the factor
  # is a property of the task type, not of the runner. That leaves
  # `timeout-minutes: 25` roughly 9x headroom, not the ~2x an estimate carried
  # over from the test leg predicts. One run is not a stable figure — re-take it
  # with the command above rather than trusting this line indefinitely.
  #
  # It is a SEPARATE job rather than a step on the Windows test leg above, for
  # two reasons. It runs in parallel, so it adds nothing to the critical path of
  # what is already the slowest job here. And folding it in would make that
  # job's NAME wrong — and that name is a required check (CONTRIBUTING.md,
  # "Checks that gate `main`"), so renaming it stops branch protection matching
  # anything and blocks every merge until a repo admin re-points it.
  windows-lint:
    name: Windows · Lint
    runs-on: windows-latest
    timeout-minutes: 25
    # `pnpm lint` fans `turbo run lint` across every package, and this was the one
    # lint-or-test step in this file with no bound on that — every Test step
    # carries `--concurrency=2`, and this leg needs it for the same reason the
    # Windows test leg does. Unbounded, each package spawns its own ESLint (several
    # spawn two, for the src+test pass split), and Windows answers a process storm
    # of that size with STATUS_DLL_INIT_FAILED (0xC0000142, surfacing as exit
    # 3221225794) rather than a lint error: the child never starts, so no lint
    # output precedes it and the victim moves between runs.
    #
    # Bounded through the environment rather than the flag because the run step has
    # to stay exactly `pnpm lint`. Going to turbo directly drops `lint:root` and
    # `check:portability`, which the root script chains and which are the only
    # coverage the repo root gets — required-checks.test.js pins that step for that
    # reason, and this bound is pinned beside it.
    env:
      TURBO_CONCURRENCY: 2
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm lint`, not `turbo run lint`: the root script chains `lint:root`
      # and `check:portability` after it, and the first of those is the pass
      # that covers the repo root. Going to turbo directly would drop both.
      - name: Lint
        run: pnpm lint
