name: Dependency audit

# Gates every change on two audits: `pnpm audit` over the workspace lockfile,
# and `npm audit` over the resolution an end user gets from installing the
# published CLI (whose runtime ranges — e.g. next's own pins — the workspace
# lockfile never covers). A high or critical advisory without an unexpired
# waiver in .github/audit-waivers.json fails the check. The daily schedule
# catches advisories published between merges — a scheduled failure opens (or
# updates) an issue labeled `security-advisory` instead of failing invisibly.
# The gate lives in tools/audit-gate (a workspace package with its own unit
# suite); the waiver process is documented in CONTRIBUTING.md.

on:
  push:
    branches: [main]
  pull_request:
  # A merge queue reaches this workflow through `merge_group` and no other event.
  # This check is meant to be required, and a required check missing this trigger
  # does not fail in the queue — it never reports, so the entry waits on it for
  # ever. See ci.yml for the same reasoning at length.
  merge_group:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

# The group includes the event name so a scheduled run never cancels (or is
# cancelled by) a push run sharing the main ref.
#
# Only a PR run is cancellable. Every push to main shares `refs/heads/main`, so a
# ref-keyed group let a second merge cancel the first commit's audit outright and
# leave that commit unaudited; keying non-PR events by SHA gives each merged
# commit its own group, which drops neither run nor queues one behind the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # The workspace audit reads the lockfile only — no `pnpm install`
      # needed. Node 24 runs the TypeScript entry directly (type stripping).
      - name: Audit workspace dependencies (high/critical gate, waiver-aware)
        run: node tools/audit-gate/src/audit-dependencies.ts

      # The artifact audit resolves cli/package.json's runtime dependencies
      # with npm in a temp dir — the tree an end-user install produces. It runs
      # even when the workspace audit fails, so one run surfaces both signals.
      - name: Audit shipped-artifact resolution (high/critical gate, waiver-aware)
        if: ${{ !cancelled() }}
        run: node tools/audit-gate/src/audit-dependencies.ts --artifact

      - name: Publish the reports to the run summary
        if: always()
        run: |
          for report in audit-report.md artifact-audit-report.md; do
            if [ -f "$report" ]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              printf '\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  # Runs where nobody is watching must not fail silently: surface the failure as
  # a tracked issue. PR runs skip this — the red check on the PR is the signal,
  # and it is in front of the one person who can act on it.
  #
  # A PUSH TO MAIN is the other unwatched run, and leaving it out left a window
  # of up to a whole day on the branch that ships. That is not hypothetical: the
  # audit failed on a main push at 2026-08-03T17:36:22Z and main stayed red until
  # the next daily run picked it up. The dedup below is what makes adding this
  # cheap — a push failure and the daily run that follows it name the same
  # advisories, so the second one posts nothing.
  report:
    name: File advisory issue (unattended runs)
    needs: audit
    if: >-
      always() && needs.audit.result == 'failure' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Re-run both audits to regenerate the reports — cheaper than artifact
      # plumbing between jobs. The exit codes are folded into one so the issue
      # title matches what actually happened: 1 (either audit found blocking
      # advisories) wins over an incomplete audit, and 0 means both re-runs
      # came back clean.
      - name: Regenerate the audit reports
        id: rerun
        run: |
          code_ws=0
          node tools/audit-gate/src/audit-dependencies.ts || code_ws=$?
          code_art=0
          node tools/audit-gate/src/audit-dependencies.ts --artifact || code_art=$?
          if [ "$code_ws" = "1" ] || [ "$code_art" = "1" ]; then
            code=1
          elif [ "$code_ws" != "0" ]; then
            code=$code_ws
          else
            code=$code_art
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # Skips when the re-run comes back clean (the earlier failure was a
      # transient blip). Comments on an existing issue only when the report
      # carries an advisory id not already posted there, so a long-lived
      # waived-or-unfixable advisory does not generate a comment per day.
      - name: Open or update the advisory issue
        if: steps.rerun.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RERUN_CODE: ${{ steps.rerun.outputs.code }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$RERUN_CODE" = "1" ]; then
            title='Dependency audit: unresolved high-severity advisories'
          else
            title='Dependency audit could not complete'
          fi
          {
            for report in audit-report.md artifact-audit-report.md; do
              if [ -f "$report" ]; then
                cat "$report"
                printf '\n'
              fi
            done
            printf '\n_Audit run (%s): %s_\n' "$GITHUB_EVENT_NAME" "$run_url"
          } > issue-body.md

          gh label create security-advisory \
            --repo "$GITHUB_REPOSITORY" \
            --description 'Automated dependency-audit finding' \
            --color B60205 --force

          existing="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --label security-advisory \
            --state open --limit 1 \
            --json number --jq '.[0].number // empty')"

          if [ -z "$existing" ]; then
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --label security-advisory \
              --body-file issue-body.md
          elif [ "$RERUN_CODE" = "1" ]; then
            # Both sides go through tools/audit-gate's own extractor rather than
            # a grep written here. It reads the report's `[<id>](<url>)` link,
            # so it sees an advisory reported under a NUMERIC registry id — the
            # form `buildReport` falls back to, which a `GHSA-`-only match
            # dropped, yielding an empty new_ids and therefore no comment at all.
            # It is also anchored on the link rather than on a bare id anywhere
            # in the text, so prose on the issue naming an advisory does not
            # count as having reported it. Unit-tested in that package; a regex
            # in this file is executed by nothing until the day it matters.
            new_ids="$(node tools/audit-gate/src/advisory-ids.ts audit-report.md artifact-audit-report.md)"
            # `|| true` on the two reads, deliberately, and it is the direction
            # that matters. A rate-limit or 5xx here would otherwise end the
            # step under the runner's default `bash -eo pipefail` BEFORE any
            # comment is posted — so a genuinely new advisory goes unreported
            # for the day, in the one job whose whole purpose is that an
            # unattended failure is never silent. Degrading to an empty seen set
            # posts a possibly-duplicate comment instead, which is the harmless
            # way to be wrong here.
            : > seen.md
            gh issue view "$existing" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' >> seen.md || true
            gh issue view "$existing" --repo "$GITHUB_REPOSITORY" --json comments --jq '.comments[].body' >> seen.md || true
            seen_ids="$(node tools/audit-gate/src/advisory-ids.ts seen.md)"
            if [ -n "$(comm -23 <(printf '%s\n' "$new_ids") <(printf '%s\n' "$seen_ids"))" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file issue-body.md
            else
              echo "No advisories beyond those already reported on issue #$existing."
            fi
          else
            echo "Audit incomplete (exit $RERUN_CODE); open issue #$existing already tracks the audit state."
          fi
