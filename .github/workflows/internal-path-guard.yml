name: Internal-path guard

# Fails if any maintainer-internal file is ever committed to this public
# repository. Maintainer-internal working directories carry a `.aka-internal`
# marker at their root, and any lone internal workflow follows an
# `*.internal.yml` naming convention; this job rejects either marker anywhere in
# the tree. It never names an internal path, so the guard itself discloses
# nothing beyond the convention. Runs on every pull request regardless of its
# base branch, so a change targeting an intermediate branch in a stack is
# guarded too, not only PRs that target main directly.

on:
  push:
    branches: [main]
  pull_request:
  # A merge queue reaches this workflow through `merge_group` and no other event,
  # and this guard is the one where being skipped is a DISCLOSURE rather than a
  # missing verdict. Two branches that are each clean can merge to a tree that is
  # not — the marker arrives from neither diff — and the queue is precisely the
  # mechanism that merges such a tree. Without this trigger the guard would first
  # see it on the post-merge `push`, i.e. after the internal path is public.
  merge_group:

permissions:
  contents: read

# Only a PR run is cancellable. Every push to main shares `refs/heads/main`, so a
# ref-keyed group let a second merge cancel the first commit's guard run outright,
# leaving that commit with its leak check neither passed nor failed; keying non-PR
# events by SHA gives each merged commit its own group, which drops neither run
# nor queues one behind the other. See ci.yml for the same reasoning at length.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    name: Reject internal-only paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check for internal-only markers
        run: |
          hits="$(git ls-files -- \
            ':(glob)**/.aka-internal' \
            ':(glob)**/*.internal.*')"
          if [ -n "$hits" ]; then
            echo "::error::Maintainer-internal files must not be committed to this public repository:"
            # shellcheck disable=SC2001 # indenting a multi-line list; ${//} does not
            echo "$hits" | sed 's/^/  /'
            exit 1
          fi
          echo "OK — no internal-only markers present."
