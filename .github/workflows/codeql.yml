name: CodeQL

# Static analysis via GitHub CodeQL over the TypeScript/JavaScript workspace
# and the Actions workflow files themselves. Runs on every PR, on main pushes,
# and weekly so newly released queries sweep the unchanged tree. Findings land
# in the repository's Security tab.

on:
  push:
    branches: [main]
  # No `branches:` filter, so a stacked PR (one based on another feature branch
  # rather than on main) is analysed too — a recorded decision, not an accident
  # of the trigger. It is also what stops the deadlock `ci.yml` documents at
  # length: there, retargeting a PR's BASE fires only `edited`, and the
  # `branches: [main]` filter means a stacked PR matches no event until it is
  # retargeted — so without `edited` the required check is permanently absent
  # and the merge is blocked with nothing to re-run. With no filter here the run
  # already happened when the PR was opened, so that state is unreachable.
  #
  # `edited` is carried anyway, for a smaller and different reason: retargeting
  # changes the MERGE COMMIT, so the analysis on the old head describes a tree
  # nobody will merge. Without this the check stays green and stale. The cost is
  # a run on title and body edits too — GitHub gives one `edited` type for all
  # three — which the concurrency group below bounds, since it cancels a
  # superseded PR run per ref rather than queueing another.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # A merge queue reaches this workflow through `merge_group` and no other event.
  # These analyses are meant to be required checks, and a required check missing
  # this trigger does not fail in the queue — it never reports, so the entry waits
  # on it for ever. See ci.yml for the same reasoning at length.
  merge_group:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Only a PR run is cancellable. Every push to main shares `refs/heads/main`, so a
# ref-keyed group let a second merge cancel the first commit's analysis outright
# and leave that commit unanalysed; keying non-PR events by SHA gives each merged
# commit its own group, which drops neither run nor queues one behind the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
