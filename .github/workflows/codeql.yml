name: CodeQL

# Static analysis via GitHub CodeQL over the TypeScript/JavaScript workspace
# and the Actions workflow files themselves. Runs on every PR, on main pushes,
# and weekly so newly released queries sweep the unchanged tree. Findings land
# in the repository's Security tab.

on:
  push:
    branches: [main]
  # No `branches:` filter, so a stacked PR (one based on another feature branch
  # rather than on main) is analysed too. That is also what keeps the default
  # event types sufficient here: `ci.yml` has to listen for `edited` because
  # retargeting a PR's BASE fires only that event, and its `branches: [main]`
  # filter means a stacked PR matches no event until it is retargeted. With no
  # filter the run already happened when the PR was opened, so a retarget has
  # nothing to re-trigger — and this check cannot end up permanently absent on
  # a PR that is required to have it.
  pull_request:
  # A merge queue reaches this workflow through `merge_group` and no other event.
  # These analyses are meant to be required checks, and a required check missing
  # this trigger does not fail in the queue — it never reports, so the entry waits
  # on it for ever. See ci.yml for the same reasoning at length.
  merge_group:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Only a PR run is cancellable. Every push to main shares `refs/heads/main`, so a
# ref-keyed group let a second merge cancel the first commit's analysis outright
# and leave that commit unanalysed; keying non-PR events by SHA gives each merged
# commit its own group, which drops neither run nor queues one behind the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
