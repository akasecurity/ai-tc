name: Lint workflows

# actionlint over every workflow in the tree: syntax, `${{ }}` expression and
# context errors, action-input typos, and — through its shellcheck integration
# (the runner ships shellcheck) — every `run:` block's shell. The workflow tree
# is the one executable surface with no other gate in front of it, and its
# failures otherwise surface on a tag push, the most expensive moment to learn
# about a quoting bug.
#
# PR-only and path-filtered, the build-binaries.yml shape: what this checks is a
# property of the files in the diff alone, so the PR run is the whole job. It
# deliberately does NOT also run on a push to main — running on both events is
# what makes a workflow a gating one, and required-checks.test.js pins that set
# with the merge-queue obligations this check does not need to carry.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # The binary comes from its GitHub release, pinned by version AND sha256 —
      # the same immutability a third-party action gets from a commit pin —
      # rather than adding an action dependency for one static binary.
      # Shellcheck runs at its DEFAULT severity. Gating at `--severity=warning`
      # reads like it only drops advisory rewrites, but SC2086 — an unquoted
      # expansion, i.e. word splitting and globbing on a value this repo did not
      # choose — is `info`, so that setting takes the most valuable check on a
      # `run:` block with it: an unquoted `rm -rf $target/build` passes at exit 0.
      # The two findings that predate this gate are false positives and carry
      # inline `# shellcheck disable=` directives naming their reason, which
      # disarms those two lines rather than a whole tier for every workflow
      # written afterwards.
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          # sha256 of actionlint_1.7.12_linux_amd64.tar.gz, from the release's
          # checksums file.
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/actionlint.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
