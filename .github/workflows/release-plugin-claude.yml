name: Release plugin (Claude Code)

# Publishes the Claude Code plugin package to the public npm registry AND to the
# repo's GitHub Packages registry, and attaches the packed tarball to a GitHub
# Release. The plugin's hook scripts are a build artifact
# (plugins/claude-code/scripts/, git-ignored) — they are generated here and shipped
# inside the package, never committed. End users install via the `ai-tc` marketplace,
# whose source resolves this package from public npm (GitHub Packages requires auth
# even for public reads, so it is a secondary artifact, not the marketplace source).
#
# Release flow: bump version in package.json + .claude-plugin/plugin.json, then
# push a tag `plugin-claude-v<version>` (e.g. plugin-claude-v0.1.0).

on:
  push:
    tags:
      - 'plugin-claude-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (otherwise build + pack only — a dry run)'
        type: boolean
        default: false

# One release per tag at a time. A single tag push can start more than one run.
# A duplicate is already self-limiting here: npm and GitHub Packages both reject a
# re-publish of the same (name, version), so the losing run fails at its publish step
# and never reaches the Release. That safety is a consequence of publish running
# before the Release step — this group holds whatever the step order, and stops two
# runs overlapping. It does not make a duplicate disappear: the queued run still
# executes afterward and still fails at publish. cancel-in-progress is false so a run
# is never interrupted midway through publishing to either registry.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Tag pushes get no run of the main CI workflow (it triggers only on main
  # pushes/PRs), so the release re-verifies the tagged commit itself — nothing
  # publishes from a commit that would fail CI.
  verify:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # --concurrency: see the Test step in ci.yml's lint job. Bounded here for
      # the same reason, and spelled on the turbo call rather than through
      # `pnpm test` — `pnpm test -- --concurrency=2` would forward the flag to
      # each TASK's own command (`vitest run --concurrency=2`), not to turbo.
      - name: Test
        run: pnpm turbo run test --concurrency=2

  release:
    name: Build · Verify · Publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC trusted publishing to npm (provenance attestation)
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin (Turbo)
        run: pnpm turbo run build --filter=@akasecurity/ai-tc-claude-code

      - name: Verify tag matches manifest versions
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#plugin-claude-v}"
          pkg=$(node -p "require('./plugins/claude-code/package.json').version")
          manifest=$(node -p "require('./plugins/claude-code/.claude-plugin/plugin.json').version")
          echo "tag=$tag  package.json=$pkg  plugin.json=$manifest"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$manifest" ]; then
            echo "::error::Version mismatch — tag plugin-claude-v$tag must equal package.json ($pkg) and plugin.json ($manifest)"
            exit 1
          fi

      - name: Smoke-test built scripts (self-contained, fail-open)
        run: |
          cd plugins/claude-code
          for f in session-start user-prompt-submit pre-tool-use post-tool-use stop; do
            test -f "scripts/$f.js" || { echo "::error::missing scripts/$f.js"; exit 1; }
          done
          # The hooks run on the user's machine with no node_modules; junk input
          # must produce no output and exit 0 (the fail-open contract).
          echo 'not json' | node scripts/user-prompt-submit.js
          echo "fail-open OK"

      - name: Pack tarball (release asset)
        run: pnpm --filter @akasecurity/ai-tc-claude-code pack --pack-destination "$RUNNER_TEMP"

      # OIDC trusted publishing: the id-token: write permission above lets npm
      # exchange this job's OIDC token for a short-lived publish credential — no
      # NPM_TOKEN needed. NPM_CONFIG_PROVENANCE has npm attach a Sigstore
      # attestation binding the published package to this repository and workflow.
      # Pre-release versions (any `-` suffix) publish under the `rc` dist-tag;
      # stable versions publish under `latest`.
      - name: Publish to npm
        if: github.event_name == 'push' || inputs.publish
        run: |
          version=$(node -p "require('./plugins/claude-code/package.json').version")
          case "$version" in
            *-*) dist_tag="rc" ;;
            *)   dist_tag="latest" ;;
          esac
          pnpm --filter @akasecurity/ai-tc-claude-code publish --no-git-checks --tag "$dist_tag"
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: ${{ runner.temp }}/*.tgz
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'plugin-claude-v0.') }}

  # Publish the same package to the repo's GitHub Packages registry (requirement:
  # packages land in the org's GitHub registry). Kept a separate job so its GitHub
  # Packages .npmrc/auth never collides with the public-npm publish above. The
  # @akasecurity scope must match the akasecurity org that owns this repo.
  github-packages:
    name: Publish to GitHub Packages
    needs: verify
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@akasecurity'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin (Turbo)
        run: pnpm turbo run build --filter=@akasecurity/ai-tc-claude-code

      # publishConfig.registry pins public npm, so override the target here. The
      # built-in GITHUB_TOKEN can publish to this repo's Packages; setup-node wrote
      # the matching auth token into .npmrc.
      - name: Publish to GitHub Packages
        run: |
          version=$(node -p "require('./plugins/claude-code/package.json').version")
          case "$version" in
            *-*) dist_tag="rc" ;;
            *)   dist_tag="latest" ;;
          esac
          pnpm --filter @akasecurity/ai-tc-claude-code publish --registry https://npm.pkg.github.com --no-git-checks --tag "$dist_tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After a successful publish, ring the marketplace's doorbell: a repository_dispatch
  # tells akasecurity/marketplace's import-plugin-release workflow that a new version
  # exists, and that workflow re-verifies everything against the registry and opens the
  # pin-advance PR. The payload carries the published dist facts as a cross-check, read
  # back from the PUBLIC registry rather than from this run's build — what the
  # marketplace pin resolves is what the registry serves, so that is what gets
  # reported — but the receiver trusts none of it: it re-derives dist and provenance
  # itself before touching the pin. Pre-release (`-` suffixed) versions dispatch too;
  # the importer declines anything that is not an exact x.y.z, so that rule lives in
  # one place, on the side that owns the pin.
  notify-marketplace:
    name: Notify marketplace importer
    needs: release
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Best-effort by design: the marketplace import can always be started by hand (its
    # workflow_dispatch takes the version as an input), so a failed doorbell must not
    # turn a completed npm publish + GitHub Release red. continue-on-error keeps the
    # run green either way; the job log still shows what happened.
    continue-on-error: true
    permissions:
      contents: read
    # Lifted to job env so the steps can gate on it in `if:` (the secrets context is
    # not available in step conditionals; the env context is), matching the notify
    # pattern in release-rules.yml. MARKETPLACE_DISPATCH_TOKEN is a fine-grained PAT
    # scoped to akasecurity/marketplace with "Contents: read and write" — sending a
    # repository_dispatch is authorized by contents write on the RECEIVING repo, which
    # this run's own GITHUB_TOKEN (scoped to this repo) can never carry. Forks, where
    # the secret is unset, skip the dispatch entirely.
    env:
      MARKETPLACE_DISPATCH_TOKEN: ${{ secrets.MARKETPLACE_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Registry-explicit (the @akasecurity scope mapping pinned on the command) so
      # nothing ambient to the runner can route the read to a registry serving
      # different bytes for the same version. A few retries absorb post-publish
      # replication lag; if the registry never serves the version this fails, which
      # continue-on-error above turns into a non-event for the release itself.
      - name: Read the published dist from the public registry
        if: env.MARKETPLACE_DISPATCH_TOKEN != ''
        run: |
          pkg=$(node -p "require('./plugins/claude-code/package.json').name")
          version=$(node -p "require('./plugins/claude-code/package.json').version")
          for attempt in 1 2 3 4 5; do
            npm view "${pkg}@${version}" dist --json \
              --@akasecurity:registry=https://registry.npmjs.org > /tmp/dist.json && break
            echo "registry does not serve ${pkg}@${version} yet (attempt ${attempt}), retrying"
            sleep 15
          done
          shasum=$(node -p "require('/tmp/dist.json').shasum ?? ''")
          integrity=$(node -p "require('/tmp/dist.json').integrity ?? ''")
          if [ -z "$shasum" ] || [ -z "$integrity" ]; then
            echo "::error::registry returned no dist.shasum/dist.integrity for ${pkg}@${version}"
            exit 1
          fi
          {
            echo "PKG=${pkg}"
            echo "PKG_VERSION=${version}"
            echo "PKG_SHASUM=${shasum}"
            echo "PKG_INTEGRITY=${integrity}"
          } >> "$GITHUB_ENV"

      # -f, not -F: every payload field is a string on purpose. -F re-types values
      # that look like numbers or booleans, and a payload field changing JSON type
      # with the content is exactly the surprise the receiver should never get.
      - name: Dispatch plugin-release to akasecurity/marketplace
        if: env.MARKETPLACE_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.MARKETPLACE_DISPATCH_TOKEN }}
        run: |
          gh api repos/akasecurity/marketplace/dispatches \
            -f event_type=plugin-release \
            -f "client_payload[package]=${PKG}" \
            -f "client_payload[version]=${PKG_VERSION}" \
            -f "client_payload[shasum]=${PKG_SHASUM}" \
            -f "client_payload[integrity]=${PKG_INTEGRITY}"
